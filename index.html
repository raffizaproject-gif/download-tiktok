<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download TT by Vixzaa</title>
<meta name="description" content="Download video TikTok HD tanpa watermark hanya dengan link.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
<style>
:root{--y:#ffcf1f;--pink:#ff4f81;--purple:#7b68ff;--green:#3cc23c;--lime:#a6e22e;--cream:#fdfaf4;--ink:#111}
*{box-sizing:border-box;margin:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  min-height:100vh;display:flex;justify-content:center;padding:28px 16px 48px;position:relative;overflow-x:hidden;
  background:var(--y);
}
body::before{content:"";position:fixed;left:-160px;top:12vh;width:380px;height:380px;border-radius:50%;background:var(--pink);z-index:0}
body::after{content:"";position:fixed;right:-10vw;bottom:-10vh;width:70vw;height:45vh;background:var(--purple);transform:skewY(-12deg);transform-origin:right bottom;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:480px}
.panel{background:var(--cream);border:4px solid var(--ink);border-radius:36px;padding:24px 20px 26px;box-shadow:14px 14px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.chip{border:3px solid var(--ink);background:var(--cream);border-radius:12px;padding:6px 12px;font-weight:800;font-size:14px;box-shadow:4px 4px 0 var(--ink)}
.chip.p{background:var(--pink);color:#fff}
h1{font-size:clamp(34px,10vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.02;margin-bottom:20px}
.row{display:flex;gap:12px;align-items:stretch}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--cream);
  border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink)}
.field b{font-size:20px}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:600 15px inherit;font-family:inherit;color:var(--ink);padding:16px 0}
.field input::placeholder{color:#777}
.field:focus-within{background:#fff8d6}
.btn{cursor:pointer;font-family:inherit;font-weight:800;color:var(--ink);border:3px solid var(--ink);border-radius:14px;
  box-shadow:5px 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.plus{width:62px;background:var(--y);font-size:28px}
.go{width:100%;margin-top:16px;padding:16px;font-size:17px;background:var(--green)}
.msg{display:none;margin-top:16px;padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#ffd6e1;font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--ink)}
.msg.show{display:block}
h2{font-size:18px;font-weight:800;margin:26px 0 14px}
.result{display:none}
.result.show{display:block}

/* kartu bergaya folder dengan tab di atas */
.folder{position:relative;margin-top:18px}
.folder::before{content:"";position:absolute;left:14px;top:-14px;width:84px;height:18px;background:var(--pink);
  border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;position:relative}
video{display:block;width:100%;max-height:440px;background:#000;object-fit:contain;border-bottom:3px solid var(--ink)}
.info{padding:14px 16px 16px}
.author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.author img{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);object-fit:cover;background:var(--y)}
.author b{display:block;font-size:15px;font-weight:800}
.author small{color:#555;font-weight:600}
.title{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border:3px solid var(--ink);border-radius:12px;text-align:center;padding:8px 2px;box-shadow:3px 3px 0 var(--ink)}
.stat:nth-child(1){background:#c9bfff}.stat:nth-child(2){background:#ffc2d4}.stat:nth-child(3){background:#c8f08a}.stat:nth-child(4){background:#ffe38a}
.stat b{display:block;font-size:16px;font-weight:900}
.stat span{font-size:11px;font-weight:700}

.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.dl .btn{padding:14px 10px;font-size:14px;background:var(--cream)}
.dl .hd{grid-column:1/-1;font-size:16px;padding:16px;background:var(--y)}
.dl .mp3{background:var(--lime)}
.dl .sd{background:#c9bfff}
.bar{display:none;height:16px;margin-top:18px;border:3px solid var(--ink);border-radius:10px;background:var(--cream);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pink);border-right:3px solid var(--ink);transition:width .2s}
.spin{display:none;width:14px;height:14px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite}
.busy .spin{display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
footer{text-align:center;font-weight:800;margin-top:28px;font-size:14px}
footer span{background:var(--cream);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;box-shadow:4px 4px 0 var(--ink);display:inline-block}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel">
    <div class="top"><span class="chip">TT</span><span class="chip p">by Vixzaa</span></div>
    <h1>Download TT.<br>Tanpa ribet.</h1>

    <div class="row">
      <label class="field"><b>#</b><input id="url" type="url" inputmode="url" autocomplete="off" placeholder="Tempel link TikTok"></label>
      <button class="btn plus" id="paste" type="button" title="Tempel dari clipboard" aria-label="Tempel dari clipboard">+</button>
    </div>
    <button class="btn go" id="go" type="button">Cari video</button>
    <div class="msg" id="msg" role="alert"></div>

    <div class="result" id="result">
      <h2>Hasil video</h2>
      <div class="folder">
        <div class="card">
          <video id="vid" controls playsinline preload="metadata"></video>
          <div class="info">
            <div class="author"><img id="av" alt=""><div><b id="nick"></b><small id="uid"></small></div></div>
            <p class="title" id="title"></p>
            <div class="stats">
              <div class="stat"><b id="sPlay">0</b><span>Tayangan</span></div>
              <div class="stat"><b id="sLike">0</b><span>Suka</span></div>
              <div class="stat"><b id="sCom">0</b><span>Komentar</span></div>
              <div class="stat"><b id="sShare">0</b><span>Bagikan</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="dl">
        <button class="btn hd" id="dHD" type="button"><span class="spin"></span><span>Download video HD</span></button>
        <button class="btn sd" id="dSD" type="button"><span class="spin"></span><span>Video biasa</span></button>
        <button class="btn mp3" id="dMP3" type="button"><span class="spin"></span><span>Audio MP3</span></button>
      </div>
      <div class="bar" id="bar"><i></i></div>
    </div>
  </section>
  <footer><span>Download TT by Vixzaa</span></footer>
</main>

<script>
const $=id=>document.getElementById(id);
const API="https://www.tikwm.com";
// Isi dengan URL Cloudflare Worker kamu (lihat worker.js), contoh: "https://tt.namamu.workers.dev"
const WORKER="";
const mp=u=>WORKER&&u?WORKER+"/dl?u="+encodeURIComponent(u):u;
let data=null;
const fmt=n=>{n=+n||0;return n>=1e9?(n/1e9).toFixed(1)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":""+n};
const abs=u=>!u?"":u.startsWith("http")?u:API+(u.startsWith("/")?"":"/")+u;
const err=t=>{$("msg").textContent=t;$("msg").classList.add("show")};
const clearErr=()=>$("msg").classList.remove("show");

async function fetchInfo(link){
  const q=API+"/api/?hd=1&url="+encodeURIComponent(link);
  const tries=[];
  if(WORKER)tries.push(()=>fetch(WORKER+"/?url="+encodeURIComponent(link)));
  tries.push(()=>fetch(API+"/api/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"hd=1&url="+encodeURIComponent(link)}));
  tries.push(()=>fetch(q));
  tries.push(()=>fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(q)));
  let last,netFail=0;
  for(const t of tries){
    try{
      const j=await (await t()).json();
      if(j&&j.code===0&&j.data)return j.data;
      last=new Error(j&&j.msg||"Video tidak ditemukan");
      if(j&&j.msg&&!/limit/i.test(j.msg))break;
    }catch(e){netFail++;last=e}
  }
  if(netFail===tries.length)throw new Error("Server downloader tidak bisa dijangkau dari browser/jaringanmu (kemungkinan diblokir). Pasang Worker proxy, lihat petunjuk");
  throw last||new Error("Gagal menghubungi layanan");
}

$("paste").onclick=async()=>{
  try{$("url").value=await navigator.clipboard.readText();$("url").focus()}
  catch{err("Izin clipboard ditolak. Tempel link secara manual.")}
};
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});

$("go").onclick=async()=>{
  clearErr();
  const link=$("url").value.trim();
  if(!/tiktok\.com/i.test(link))return err("Masukkan link TikTok yang valid, contoh: https://vt.tiktok.com/xxxx");
  const b=$("go");b.disabled=true;b.textContent="Mencari...";
  $("result").classList.remove("show");
  try{
    const d=data=await fetchInfo(link);
    $("vid").poster=abs(d.cover);
    $("vid").src=mp(abs(d.play||d.hdplay));
    $("av").src=abs(d.author&&d.author.avatar);
    $("nick").textContent=d.author?d.author.nickname:"";
    $("uid").textContent=d.author?"@"+d.author.unique_id:"";
    $("title").textContent=d.title||"(tanpa judul)";
    $("sPlay").textContent=fmt(d.play_count);
    $("sLike").textContent=fmt(d.digg_count);
    $("sCom").textContent=fmt(d.comment_count);
    $("sShare").textContent=fmt(d.share_count);
    $("result").classList.add("show");
    $("result").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){
    err("Gagal mengambil video: "+(e.message||"coba lagi")+". Pastikan video publik dan link benar.");
  }finally{b.disabled=false;b.textContent="Cari video"}
};

async function save(btn,url,name){
  if(!url)return err("Format ini tidak tersedia untuk video tersebut.");
  clearErr();
  const bar=$("bar"),fill=bar.firstElementChild;
  btn.classList.add("busy");btn.disabled=true;bar.style.display="block";fill.style.width="5%";
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const total=+r.headers.get("content-length")||0;
    const rd=r.body.getReader(),parts=[];let got=0;
    for(;;){
      const {done,value}=await rd.read();
      if(done)break;
      parts.push(value);got+=value.length;
      if(total)fill.style.width=Math.min(95,got/total*100)+"%";
    }
    fill.style.width="100%";
    const blob=new Blob(parts,{type:r.headers.get("content-type")||"video/mp4"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){
    window.open(url,"_blank","noopener");
    err("Unduhan langsung dibatasi browser, file dibuka di tab baru. Tekan lama / klik kanan lalu simpan.");
  }finally{
    btn.classList.remove("busy");btn.disabled=false;
    setTimeout(()=>{bar.style.display="none";fill.style.width="0"},800);
  }
}
const base=()=>"tt-vixzaa-"+(data&&data.id||Date.now());
$("dHD").onclick=()=>save($("dHD"),mp(abs(data.hdplay||data.play)),base()+"-hd.mp4");
$("dSD").onclick=()=>save($("dSD"),mp(abs(data.play)),base()+".mp4");
$("dMP3").onclick=()=>save($("dMP3"),mp(abs(data.music)),base()+".mp3");
</script>
</body>
</html>
